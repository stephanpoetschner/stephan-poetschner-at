<!DOCTYPE html>
<html lang="de">
<head>
  {% block head %}
  <meta charset="utf-8">
  <title>{% block title %}{{ NAME }}{% endblock title %}</title>

  {% if META %}
  <meta name="description" content="{{ META }}">
  {% endif %}

  <meta name="google-site-verification" content="{{ GOOGLE_WEBMASTERS }}" />

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="{{ static_url('css/main.css') }}">

  {% endblock head %}
</head>
<body>

  {% block nav %}
  {% endblock %}

  <div class="container">
    {% block main %}
    {% endblock %}
  </div><!-- .container -->

  {% block footer %}
  {% endblock %}

</body>
</html>
